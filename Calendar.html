<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Calendar View</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --border-color: #444;
            --text-main: #d4d4d4;
            --text-muted: #858585;
            --highlight: #0e639c;
            --highlight-hover: #1177bb;
            --font-mono: 'Consolas', 'Courier New', monospace;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-mono);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        button {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 1rem;
        }

        button:hover { color: #fff; }

        /* Top Calendar Nav */
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Calendar Grid */
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-family: var(--font-sans);
        }

        .calendar-table th, .calendar-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        .calendar-table th {
            background-color: #2d2d2d;
            font-weight: normal;
            color: var(--text-muted);
            text-align: center;
        }

        .calendar-table td {
            height: 80px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calendar-table td:hover { background-color: #2a2d2e; }
        .calendar-table td.empty { background-color: transparent; cursor: default; }
        .calendar-table td.selected { background-color: #37373d; border-color: #007acc; }

        /* Bottom Section Grid */
        .bottom-section {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 30px;
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
        }

        /* Left: Cards View */
        .cards-header {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .event-card {
            border: 1px dashed var(--border-color);
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
        }

        .card-img-container {
            position: relative;
            height: 140px;
            background-color: #333;
            background-size: cover;
            background-position: center;
        }

        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 10px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .card-footer {
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border-top: 1px dashed var(--border-color);
        }

        .flag-icon {
            width: 24px;
            height: 16px;
            object-fit: cover;
            border-radius: 2px;
            background: #444; /* Placeholder if missing */
        }

        /* Right: Weeks Timeline */
        .timeline-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-left: 1px solid var(--border-color);
        }

        .timeline-day {
            position: relative;
            padding-left: 20px;
        }

        .timeline-date {
            color: var(--text-main);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }

        .timeline-date.is-selected { color: #4fc1ff; }

        .timeline-events {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding-left: 15px;
        }

        .evt-btn {
            background-color: #333;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 3px;
            transition: 0.2s;
        }

        .evt-btn:hover { background-color: var(--highlight); border-color: var(--highlight); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
            width: 400px;
            font-family: var(--font-sans);
        }

        .modal-content h3 { margin-bottom: 15px; font-weight: normal; font-family: var(--font-mono); }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 6px 12px; background: #333; border-radius: 4px; }
        .modal-actions button.primary { background: var(--highlight); }
        .modal-actions button.primary:hover { background: var(--highlight-hover); }
        
        .no-data { font-style: italic; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <div class="calendar-nav">
        <div class="nav-group">
            <button id="prev-year">&lt;&lt;</button>
            <span id="label-year">2026</span>
            <button id="next-year">&gt;&gt;</button>
        </div>
        <span>|</span>
        <div class="nav-group">
            <button id="prev-month">&lt;&lt;</button>
            <span id="label-month" style="width: 90px; text-align: center;">April</span>
            <button id="next-month">&gt;&gt;</button>
        </div>
        <span>|</span>
        <span>&lt;&lt; Gregorian &gt;&gt;</span>
    </div>

    <!-- CALENDAR GRID -->
    <table class="calendar-table">
        <thead>
            <tr>
                <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
            </tr>
        </thead>
        <tbody id="calendar-body">
            <!-- Rendered by JS -->
        </tbody>
    </table>

    <!-- BOTTOM SECTION -->
    <div class="bottom-section">
        <!-- Left: Cards -->
        <div>
            <div class="cards-header" id="selected-date-header">Saturday, 25 April 2026</div>
            <div class="cards-grid" id="cards-container">
                <!-- Cards rendered by JS -->
            </div>
        </div>

        <!-- Right: Timeline -->
        <div>
            <div class="timeline-header">
                <span>&lt;=]</span>
                <span>Weeks</span>
            </div>
            <div class="timeline-container" id="timeline-container">
                <!-- Timeline rendered by JS -->
            </div>
        </div>
    </div>

    <!-- IMAGE EDIT MODAL -->
    <div class="modal-overlay" id="img-modal">
        <div class="modal-content">
            <h3>Edit Event Image URL</h3>
            <p id="modal-event-name" style="margin-bottom: 10px; color: var(--text-muted);"></p>
            <input type="text" id="img-url-input" placeholder="https://example.com/image.jpg">
            <div class="modal-actions">
                <button id="modal-cancel">Cancel</button>
                <button class="primary" id="modal-save">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        // Default values mimicking the image state
        let currentDate = new Date(2026, 3, 25); // 25 April 2026
        let selectedDate = new Date(currentDate);
        let viewMonth = selectedDate.getMonth();
        let viewYear = selectedDate.getFullYear();

        let eventsDatabase = [];
        let editingEventTitle = null;

        // Fallback Mock Data matching the requested structure
        const mockDatabase = [
            {
                "date": "2504",
                "general_events": [
                    {"title": "Freedom Day Celebration", "country": "Portugal"}
                ],
                "evt_2026": [
                    {"title": "Global Tech Summit", "country": "Japan"},
                    {"title": "Design Expo", "country": "Italy"},
                    {"title": "Music Festival", "country": "Angola"}
                ]
            },
            {
                "date": "2104",
                "general_events": [{"title": "Earth Day Prep", "country": "USA"}],
                "evt_2026": []
            },
            {
                "date": "2404",
                "general_events": [],
                "evt_2026": [{"title": "Pre-Summit Workshop", "country": "Japan"}, {"title": "Networking Dinner", "country": "Japan"}]
            }
        ];

        // --- 2. DATA LOADING ---
        async function loadEventsData() {
            try {
                const response = await fetch('events.json');
                if (!response.ok) throw new Error("Network response was not ok");
                eventsDatabase = await response.json();
            } catch (error) {
                console.warn("Could not load events.json, falling back to mock database.", error);
                eventsDatabase = mockDatabase;
            }
            renderAll();
        }

        // --- 3. HELPER FUNCTIONS ---
        function getFormattedDateStr(dateObj) {
            // Returns "DDMM"
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            return `${dd}${mm}`;
        }

        function getEventsForDate(dateObj) {
            const dateStr = getFormattedDateStr(dateObj);
            const yearStr = `evt_${dateObj.getFullYear()}`;
            
            const dbEntry = eventsDatabase.find(e => e.date === dateStr);
            if (!dbEntry) return [];

            const general = dbEntry.general_events || [];
            const yearly = dbEntry[yearStr] || [];
            return [...general, ...yearly];
        }

        // --- 4. RENDER LOGIC ---
        function renderAll() {
            renderTopNav();
            renderCalendarGrid();
            renderBottomSection();
        }

        function renderTopNav() {
            document.getElementById('label-year').textContent = viewYear;
            document.getElementById('label-month').textContent = monthNames[viewMonth];
        }

        function renderCalendarGrid() {
            const tbody = document.getElementById('calendar-body');
            tbody.innerHTML = '';

            // Calculate days for the month. Monday is the first day of the week.
            const firstDayOfMonth = new Date(viewYear, viewMonth, 1);
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            
            // Adjust to make Monday index 0, Sunday index 6
            let startDayIndex = firstDayOfMonth.getDay(); 
            startDayIndex = startDayIndex === 0 ? 6 : startDayIndex - 1;

            let row = document.createElement('tr');
            
            // Empty cells before the 1st
            for (let i = 0; i < startDayIndex; i++) {
                const cell = document.createElement('td');
                cell.className = 'empty';
                row.appendChild(cell);
            }

            // Fill days
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('td');
                cell.textContent = day;
                
                // Highlight if selected date
                if (viewYear === selectedDate.getFullYear() && viewMonth === selectedDate.getMonth() && day === selectedDate.getDate()) {
                    cell.classList.add('selected');
                }

                cell.addEventListener('click', () => {
                    selectedDate = new Date(viewYear, viewMonth, day);
                    renderAll();
                });

                row.appendChild(cell);

                // Wrap row at Sunday (index 6)
                if (row.children.length === 7) {
                    tbody.appendChild(row);
                    row = document.createElement('tr');
                }
            }

            // Fill empty cells at the end
            if (row.children.length > 0 && row.children.length < 7) {
                const remaining = 7 - row.children.length;
                for (let i = 0; i < remaining; i++) {
                    const cell = document.createElement('td');
                    cell.className = 'empty';
                    row.appendChild(cell);
                }
                tbody.appendChild(row);
            }
        }

        function renderBottomSection() {
            // 1. Update Header
            const header = document.getElementById('selected-date-header');
            const dayName = dayNames[selectedDate.getDay()];
            const dayNum = selectedDate.getDate();
            const monthName = monthNames[selectedDate.getMonth()];
            header.textContent = `${dayName}, ${dayNum} ${monthName} ${selectedDate.getFullYear()}`;

            // 2. Render Left Cards
            renderCards();

            // 3. Render Right Timeline
            renderTimeline();
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            const events = getEventsForDate(selectedDate);
            
            if (events.length === 0) {
                container.innerHTML = `<div class="no-data">No events for this date.</div>`;
                return;
            }

            events.forEach(evt => {
                const imgKey = `img_${evt.title}`;
                const savedImgUrl = localStorage.getItem(imgKey) || ''; 
                
                const card = document.createElement('div');
                card.className = 'event-card';

                // We construct the path as requested: flag/{CountryName}.svg
                const flagPath = `flag/${evt.country}.svg`;

                card.innerHTML = `
                    <div class="card-img-container" style="background-image: url('${savedImgUrl}')">
                        <div class="card-title">${evt.title}</div>
                    </div>
                    <div class="card-footer">
                        <img src="${flagPath}" alt="${evt.country} flag" class="flag-icon" onerror="this.style.display='none'">
                        <span>${evt.country}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            // Find Monday of the selected date's week
            const selectedDayIndex = selectedDate.getDay() === 0 ? 6 : selectedDate.getDay() - 1;
            const weekStart = new Date(selectedDate);
            weekStart.setDate(selectedDate.getDate() - selectedDayIndex);

            for (let i = 0; i < 7; i++) {
                const loopDate = new Date(weekStart);
                loopDate.setDate(weekStart.getDate() + i);
                
                const isSelected = loopDate.toDateString() === selectedDate.toDateString();
                const dateNum = loopDate.getDate();
                const dayName = dayNames[loopDate.getDay()];
                
                const dayEvents = getEventsForDate(loopDate);

                const dayBlock = document.createElement('div');
                dayBlock.className = 'timeline-day';

                // Format Indicator mimicking image: `[==<o> 25 - Saturday` vs `o 24 - Friday`
                let dateLabelHTML = '';
                if (isSelected) {
                    dateLabelHTML = `<div class="timeline-date is-selected">[==&lt;o&gt; ${dateNum} - ${dayName}</div>`;
                } else {
                    dateLabelHTML = `<div class="timeline-date">| o ${dateNum} - ${dayName}</div>`;
                }

                let eventsHTML = '<div class="timeline-events">| ';
                if (dayEvents.length > 0) {
                    dayEvents.forEach(evt => {
                        eventsHTML += `<button class="evt-btn" data-title="${evt.title}">[Evt] ${evt.title}</button>`;
                    });
                }
                eventsHTML += '</div>';

                dayBlock.innerHTML = dateLabelHTML + eventsHTML;
                container.appendChild(dayBlock);
            }

            // Bind Event Box Clicks
            document.querySelectorAll('.evt-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    openModal(e.target.getAttribute('data-title'));
                });
            });
        }

        // --- 5. MODAL LOGIC (LOCAL STORAGE) ---
        const modal = document.getElementById('img-modal');
        const imgInput = document.getElementById('img-url-input');

        function openModal(eventTitle) {
            editingEventTitle = eventTitle;
            document.getElementById('modal-event-name').textContent = `Set image for: ${eventTitle}`;
            
            // Get existing from local storage
            imgInput.value = localStorage.getItem(`img_${eventTitle}`) || '';
            modal.style.display = 'flex';
            imgInput.focus();
        }

        function closeModal() {
            modal.style.display = 'none';
            editingEventTitle = null;
        }

        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        
        document.getElementById('modal-save').addEventListener('click', () => {
            if (editingEventTitle) {
                localStorage.setItem(`img_${editingEventTitle}`, imgInput.value.trim());
                renderCards(); // Refresh UI
            }
            closeModal();
        });

        // --- 6. EVENT LISTENERS ---
        document.getElementById('prev-year').addEventListener('click', () => { viewYear--; renderAll(); });
        document.getElementById('next-year').addEventListener('click', () => { viewYear++; renderAll(); });
        
        document.getElementById('prev-month').addEventListener('click', () => {
            viewMonth--;
            if (viewMonth < 0) { viewMonth = 11; viewYear--; }
            renderAll();
        });
        
        document.getElementById('next-month').addEventListener('click', () => {
            viewMonth++;
            if (viewMonth > 11) { viewMonth = 0; viewYear++; }
            renderAll();
        });

        // Initialize
        loadEventsData();

    </script>
</body>
</html>
